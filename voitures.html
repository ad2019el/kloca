<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Annonces - Vente Achat - kloca</title>

<body>
    <header >
       <div class="logo">KLOCA</div>

    <section class="recherche"></section>
         <div class="barre-recherche">
            <input type="text" placeholder="Votre recherche ici" id="recherche-texte">
            <select id="filtre-marque">
                <option value="">Toutes les marques</option>
                 <option value="Renault">Renault</option>
                 <option value="Peugeot">Peugeot</option>
                 <option value="Volkswagen">Volkswagen</option>
                 <option value="Mercedes">Mercedes</option>
                 <option value="Seat">Seat</option>
                 <option value="BMW">BMW</option>
                 <option value="Hyundai">Hyundai</option>
                 <option value="Geely">Geely</option>
                 <option value="Porsche">Porsche</option>
            </select>
            <select id="filtre-prix">
                <option value="99999999">Prix max</option>
                <option value="1000000">1 000 000 DZD</option>
                <option value="2000000">2 000 000 DZD</option>
                <option value="3000000">3 000 000 DZD</option>
                <option value="5000000">5 000 000 DZD</option>
            </select>
             <button id="btn-rechercher">Rechercher</button>
        </div>
</section>
    <!--VEHICULES EN VEDETTE-->

    <section class="vidette">
        <h2>Véhicules en vedette</h2>
       
        <div class="grille-vehicules" id="grille">
           
        </div>

     <footer>
